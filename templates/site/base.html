<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}phildini.net{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="alternate" type="application/atom+xml" title="phildini.net" href="/feed.xml">
  <link rel="webmention" href="https://webmention.io/{{ site_domain }}/webmention">
  <link rel="pingback" href="https://webmention.io/{{ site_domain }}/xmlrpc">
  <meta name="fediverse:creator" content="{% block fediverse_handle %}{% endblock %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="/"><strong>phildini.net</strong></a></li>
      </ul>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/archive/">Archive</a></li>
        <li><a href="/now/">Now</a></li>
        <li><a href="/feed.xml">RSS</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <p>
      <a href="https://bsky.app/profile/{{ site_domain }}">Bluesky</a> &middot;
      <a href="https://mastodon.social/@phildini">Mastodon</a> &middot;
      <a href="https://github.com/phildini">GitHub</a>
    </p>
    <p><small>&copy; {{ now|date:"Y" }} Philip James. All rights reserved.</small></p>
  </footer>
</body>
</html>
